<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <rect width="320" height="200" rx="16" fill="#F6F9FD"/>
  <circle cx="160" cy="100" r="85" stroke="#2457A7" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- Constitution Book / Scroll of Rights & Scales -->
  <g transform="translate(85, 30)">
    <!-- Shield of Constitutional Protection -->
    <path d="M75 10 L125 28 V75 C125 110 95 130 75 140 C55 130 25 110 25 75 V28 Z" fill="#102B50" stroke="#F2A541" stroke-width="2"/>
    <path d="M75 18 L117 33 V74 C117 104 92 121 75 130 C58 121 33 104 33 74 V33 Z" fill="#1B3A64"/>
    
    <!-- Inner Scales of Justice inside Shield -->
    <line x1="75" y1="42" x2="75" y2="92" stroke="#F2A541" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="52" y1="52" x2="98" y2="52" stroke="#F2A541" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Left Dish -->
    <line x1="52" y1="52" x2="45" y2="70" stroke="#F2A541" stroke-width="1.2"/>
    <line x1="52" y1="52" x2="59" y2="70" stroke="#F2A541" stroke-width="1.2"/>
    <path d="M42 70 C42 76 62 76 62 70 Z" fill="#F2A541"/>

    <!-- Right Dish -->
    <line x1="98" y1="52" x2="91" y2="70" stroke="#F2A541" stroke-width="1.2"/>
    <line x1="98" y1="52" x2="105" y2="70" stroke="#F2A541" stroke-width="1.2"/>
    <path d="M88 70 C88 76 108 76 108 70 Z" fill="#F2A541"/>

    <path d="M63 92 H87" stroke="#F2A541" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Fundamental Rights Laurel Leaves / Civic Badges -->
  <g transform="translate(35, 75)">
    <circle cx="20" cy="20" r="18" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="20" y="24" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="10" fill="#2457A7">RTI</text>
  </g>
  <g transform="translate(245, 75)">
    <circle cx="20" cy="20" r="18" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="20" y="24" text-anchor="middle" font-family="system-ui" font-weight="700" font-size="9" fill="#F2A541">LEGAL</text>
  </g>
</svg>
