<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="50" y1="50" x2="590" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF9F6"/>
      <stop offset="50%" stop-color="#F0F4FA"/>
      <stop offset="100%" stop-color="#E8EEF8"/>
    </linearGradient>
    
    <linearGradient id="citizenGlow" x1="260" y1="180" x2="380" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2457A7"/>
      <stop offset="100%" stop-color="#102B50"/>
    </linearGradient>

    <linearGradient id="saffronGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#F2A541"/>
    </linearGradient>

    <linearGradient id="cardGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7FAFC"/>
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#102B50" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#102B50" flood-opacity="0.04"/>
    </filter>

    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2457A7" flood-opacity="0.2"/>
    </filter>

    <style>
      @keyframes dashFlowOut {
        to {
          stroke-dashoffset: -40;
        }
      }
      @keyframes orbitSpinCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes orbitSpinCCW {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      @keyframes pulseAura {
        0%, 100% { r: 50px; opacity: 0.8; }
        50% { r: 58px; opacity: 0.35; }
      }
      @keyframes floatNodeA {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatNodeB {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes beaconPing {
        0% { transform: scale(0.9); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 0.2; }
        100% { transform: scale(0.9); opacity: 0.8; }
      }

      .pulse-line-scheme {
        stroke-dasharray: 8 6;
        animation: dashFlowOut 2.2s linear infinite;
      }
      .pulse-line-law {
        stroke-dasharray: 8 6;
        animation: dashFlowOut 2.8s linear infinite;
      }
      .orbit-cw {
        transform-origin: 320px 260px;
        animation: orbitSpinCW 40s linear infinite;
      }
      .orbit-ccw {
        transform-origin: 320px 260px;
        animation: orbitSpinCCW 55s linear infinite;
      }
      .aura-breath {
        animation: pulseAura 4s ease-in-out infinite;
      }
      .node-float-1 {
        animation: floatNodeA 5s ease-in-out infinite;
      }
      .node-float-2 {
        animation: floatNodeB 5.5s ease-in-out infinite 0.5s;
      }
      .node-float-3 {
        animation: floatNodeA 6s ease-in-out infinite 1s;
      }
      .beacon-ring {
        transform-origin: 320px 260px;
        animation: beaconPing 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <rect x="20" y="20" width="600" height="480" rx="28" fill="url(#bgGrad)"/>
  
  <!-- Subtle Concentric Cosmic / Dharma Navigation Orbits (With Smooth Rotation) -->
  <circle class="orbit-cw" cx="320" cy="260" r="210" stroke="#2457A7" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="6 8"/>
  <circle class="orbit-ccw" cx="320" cy="260" r="150" stroke="#2457A7" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle class="orbit-cw" cx="320" cy="260" r="90" stroke="#F2A541" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Dynamic Curved Connecting Optical Fibre Lines with Animated Dash Pulses -->
  <!-- To Govt Services (Top Left) -->
  <path class="pulse-line-scheme" d="M320 260 C 260 210, 190 140, 130 110" stroke="#2457A7" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>
  
  <!-- To Legal Justice (Top Right) -->
  <path class="pulse-line-law" d="M320 260 C 380 200, 460 140, 510 110" stroke="#F2A541" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9"/>
  
  <!-- To Education (Left Center) -->
  <path class="pulse-line-scheme" d="M320 260 C 240 260, 180 240, 90 240" stroke="#2457A7" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7"/>
  
  <!-- To Employment (Right Center) -->
  <path class="pulse-line-scheme" d="M320 260 C 400 260, 470 240, 550 250" stroke="#2457A7" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7"/>

  <!-- To Financial Support (Bottom Left) -->
  <path class="pulse-line-law" d="M320 260 C 260 330, 200 380, 140 410" stroke="#F2A541" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- To Citizen Empowerment (Bottom Right) -->
  <path class="pulse-line-scheme" d="M320 260 C 380 340, 440 380, 500 410" stroke="#2457A7" stroke-width="3" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- CENTRAL EMPOWERED CITIZEN HUB -->
  <g id="central-citizen">
    <!-- Breathing Outer Aura Ring -->
    <circle class="aura-breath" cx="320" cy="260" r="54" fill="#2457A7" fill-opacity="0.1"/>
    <circle class="beacon-ring" cx="320" cy="260" r="62" stroke="#F2A541" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="320" cy="260" r="50" fill="url(#citizenGlow)" filter="url(#nodeGlow)"/>
    <circle cx="320" cy="260" r="48" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.35"/>
    
    <!-- Stylized Citizen Silhouette & Ashoka Accent -->
    <circle cx="320" cy="242" r="13" fill="#FFFFFF"/>
    <path d="M298 278 C298 262 308 259 320 259 C332 259 342 262 342 278 Z" fill="#FFFFFF"/>
    <path d="M312 260 L320 274 L328 260 Z" fill="url(#saffronGrad)"/>

    <!-- Central Saarthi Compass Badge -->
    <circle cx="320" cy="292" r="9" fill="#F2A541" filter="url(#softShadow)"/>
    <path d="M320 286 L323 292 L320 298 L317 292 Z" fill="#102B50"/>
  </g>

  <!-- NODE 1: Government Services (Top Left) -->
  <g class="node-float-1" transform="translate(60, 65)" filter="url(#softShadow)">
    <rect width="140" height="68" rx="16" fill="url(#cardGlow)" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="12" y="14" width="40" height="40" rx="10" fill="#2457A7" fill-opacity="0.1"/>
    <!-- Govt Building Icon -->
    <path d="M32 20 L44 26 L20 26 Z" fill="#2457A7"/>
    <rect x="23" y="28" width="4" height="14" fill="#2457A7"/>
    <rect x="30" y="28" width="4" height="14" fill="#2457A7"/>
    <rect x="37" y="28" width="4" height="14" fill="#2457A7"/>
    <rect x="20" y="42" width="24" height="3" rx="1" fill="#2457A7"/>
    <text x="60" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#102B50">Government</text>
    <text x="60" y="47" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#687386">Public Services</text>
  </g>

  <!-- NODE 2: Legal Justice (Top Right) -->
  <g class="node-float-2" transform="translate(440, 65)" filter="url(#softShadow)">
    <rect width="140" height="68" rx="16" fill="url(#cardGlow)" stroke="#FEEBC8" stroke-width="1.5"/>
    <rect x="12" y="14" width="40" height="40" rx="10" fill="#F2A541" fill-opacity="0.15"/>
    <!-- Scales of Justice Icon -->
    <path d="M32 20 V42 M22 26 H42" stroke="#F2A541" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M22 26 L17 34 H27 Z" fill="#F2A541" fill-opacity="0.8"/>
    <path d="M42 26 L37 34 H47 Z" fill="#F2A541" fill-opacity="0.8"/>
    <text x="60" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#102B50">Legal Justice</text>
    <text x="60" y="47" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#687386">Rights & Remedies</text>
  </g>

  <!-- NODE 3: Education & Skills (Left Mid) -->
  <g class="node-float-3" transform="translate(25, 205)" filter="url(#softShadow)">
    <rect width="130" height="64" rx="16" fill="url(#cardGlow)" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="34" cy="32" r="18" fill="#2457A7" fill-opacity="0.08"/>
    <!-- Mortarboard Icon -->
    <path d="M34 22 L46 27 L34 32 L22 27 Z" fill="#2457A7"/>
    <path d="M26 30 V37 C26 40 42 40 42 37 V30" stroke="#2457A7" stroke-width="1.8" fill="none"/>
    <path d="M44 28 V36" stroke="#F2A541" stroke-width="2"/>
    <text x="60" y="31" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#102B50">Education</text>
    <text x="60" y="46" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#687386">Scholarships</text>
  </g>

  <!-- NODE 4: Employment & MSME (Right Mid) -->
  <g class="node-float-1" transform="translate(485, 215)" filter="url(#softShadow)">
    <rect width="130" height="64" rx="16" fill="url(#cardGlow)" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="34" cy="32" r="18" fill="#2457A7" fill-opacity="0.08"/>
    <!-- Briefcase / Enterprise Icon -->
    <rect x="23" y="25" width="22" height="15" rx="3" stroke="#2457A7" stroke-width="2" fill="none"/>
    <path d="M29 25 V22 C29 20.8 30 20 31 20 H37 C38 20 39 20.8 39 22 V25" stroke="#2457A7" stroke-width="1.8"/>
    <path d="M34 31 V34" stroke="#F2A541" stroke-width="2"/>
    <text x="60" y="31" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#102B50">Employment</text>
    <text x="60" y="46" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#687386">Jobs & MSME</text>
  </g>

  <!-- NODE 5: Financial Support & DBT (Bottom Left) -->
  <g class="node-float-2" transform="translate(60, 375)" filter="url(#softShadow)">
    <rect width="140" height="68" rx="16" fill="url(#cardGlow)" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="12" y="14" width="40" height="40" rx="10" fill="#F2A541" fill-opacity="0.12"/>
    <!-- Rupee / Direct Benefit Transfer Icon -->
    <circle cx="32" cy="34" r="12" fill="#F2A541"/>
    <text x="32" y="39" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">₹</text>
    <text x="60" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#102B50">Financial DBT</text>
    <text x="60" y="47" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#687386">Direct Assistance</text>
  </g>

  <!-- NODE 6: Citizen Empowerment (Bottom Right) -->
  <g class="node-float-3" transform="translate(440, 375)" filter="url(#softShadow)">
    <rect width="140" height="68" rx="16" fill="url(#cardGlow)" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="12" y="14" width="40" height="40" rx="10" fill="#2457A7" fill-opacity="0.1"/>
    <!-- Shield / Civic Empowerment Icon -->
    <path d="M32 20 L42 24 V33 C42 39 37 43 32 45 C27 43 22 39 22 33 V24 Z" fill="#2457A7"/>
    <path d="M28 32 L31 35 L37 28" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#102B50">Empowerment</text>
    <text x="60" y="47" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#687386">Civic Rights</text>
  </g>

  <!-- Floating Micro Metric Badges for SaaS polish -->
  <g class="node-float-1" transform="translate(230, 80)" filter="url(#softShadow)">
    <rect width="180" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="20" cy="17" r="6" fill="#10B981"/>
    <text x="35" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#102B50">1,200+ Central & State Schemes</text>
  </g>

  <g class="node-float-2" transform="translate(235, 435)" filter="url(#softShadow)">
    <rect width="170" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="20" cy="17" r="6" fill="#F2A541"/>
    <text x="35" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#102B50">500+ Decoded Indian Laws</text>
  </g>
</svg>
