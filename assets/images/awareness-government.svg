<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <rect width="320" height="200" rx="16" fill="#F4F7FC"/>
  <!-- Decorative arcs -->
  <circle cx="160" cy="180" r="110" stroke="#2457A7" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="160" cy="180" r="70" stroke="#2457A7" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- Modern Parliament / Civic Architecture Composition -->
  <g transform="translate(70, 35)">
    <!-- Central Dome -->
    <path d="M90 60 C90 35 110 20 125 15 C140 20 160 35 160 60 Z" fill="#2457A7" fill-opacity="0.15"/>
    <!-- Flag atop dome -->
    <line x1="125" y1="5" x2="125" y2="15" stroke="#102B50" stroke-width="1.5"/>
    <path d="M125 5 L135 8 L125 11 Z" fill="#F2A541"/>

    <!-- Pediment Roof -->
    <polygon points="10 60, 90 25, 170 60" fill="#2457A7" fill-opacity="0.85"/>
    <!-- Base Architrave -->
    <rect x="0" y="60" width="180" height="8" rx="2" fill="#102B50"/>

    <!-- Pillars (Colonnade) -->
    <rect x="18" y="68" width="8" height="52" rx="1" fill="#2457A7"/>
    <rect x="42" y="68" width="8" height="52" rx="1" fill="#2457A7"/>
    <rect x="66" y="68" width="8" height="52" rx="1" fill="#2457A7"/>
    <rect x="90" y="68" width="8" height="52" rx="1" fill="#2457A7"/>
    <rect x="114" y="68" width="8" height="52" rx="1" fill="#2457A7"/>
    <rect x="138" y="68" width="8" height="52" rx="1" fill="#2457A7"/>
    <rect x="154" y="68" width="8" height="52" rx="1" fill="#2457A7"/>

    <!-- Podium Foundation -->
    <rect x="-10" y="120" width="200" height="12" rx="3" fill="#102B50"/>
    <rect x="-20" y="132" width="220" height="8" rx="2" fill="#2457A7" fill-opacity="0.4"/>
  </g>

  <!-- Floating Governance Nodes (Center, State, Panchayat) -->
  <g transform="translate(30, 25)">
    <circle cx="16" cy="16" r="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="16" cy="16" r="5" fill="#F2A541"/>
  </g>
  <g transform="translate(255, 30)">
    <circle cx="16" cy="16" r="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="16" cy="16" r="5" fill="#2457A7"/>
  </g>
</svg>
